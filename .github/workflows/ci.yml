name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest macOS the app supports, and the newest the runners offer.
        # Both job names are required status checks on main — renaming this job
        # or changing these values will block merges until the branch protection
        # rule is updated to match.
        os: [macos-14, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        run: ./Scripts/build-app.sh

      - name: Test
        run: ./Scripts/test.sh

      - name: Check the bundle
        run: |
          APP="build/T3 Notch.app"
          test -x "$APP/Contents/MacOS/T3Notch"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"

      - name: Exercise the fixture database
        run: |
          ./Scripts/fixture.sh setup
          ./Scripts/fixture.sh seed
          ./Scripts/fixture.sh run
          ./Scripts/fixture.sh ask
          ./Scripts/fixture.sh finish
          ./Scripts/fixture.sh fail
