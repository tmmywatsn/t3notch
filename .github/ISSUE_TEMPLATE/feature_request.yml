name: Feature request
description: Describe a problem T3 Notch could solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and any workaround you use today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the result you want and any alternatives you considered.
    validations:
      required: true
